<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      color: purple;
      margin-bottom: 20px;
      font-size: 32px;
    }

    .auth-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .auth-box h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .auth-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .auth-box button {
      width: 100%;
      padding: 12px;
      background-color: purple;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .auth-box p {
      text-align: center;
      color: #666;
      font-size: 14px;
      cursor: pointer;
    }

    .auth-box p span {
      color: purple;
      font-weight: bold;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background-color: #ddd;
      color: #333;
    }

    .tab.active {
      background-color: purple;
      color: white;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .input-box input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .save-btn {
      background-color: purple;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .note {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note p {
      font-size: 16px;
      color: #333;
      margin: 0;
    }

    .note span {
      font-size: 12px;
      color: #666;
    }

    .actions { display: flex; gap: 8px; }

    .delete-btn {
      background-color: transparent;
      color: #e53e3e;
      padding: 8px 14px;
      border: 2px solid #e53e3e;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background-color: #e53e3e;
      color: white;
    }

    .restore-btn {
      background-color: green;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .permanent-btn {
      background-color: #333;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      font-size: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logout-btn {
      background-color: #eee;
      color: #333;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- AUTH SECTION -->
    <div id="authSection">
      <h1>My Notes</h1>

      <!-- LOGIN FORM -->
      <div id="loginForm" class="auth-box">
        <h2>Login</h2>
        <p id="loginError" class="error"></p>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <p>Don't have an account? <span onclick="showSignup()">Sign up</span></p>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" class="auth-box" style="display:none">
        <h2>Sign Up</h2>
        <p id="signupError" class="error"></p>
        <input id="signupEmail" type="email" placeholder="Email" />
        <input id="signupPassword" type="password" placeholder="Password" />
        <button onclick="signup()">Create Account</button>
        <p>Already have an account? <span onclick="showLogin()">Login</span></p>
      </div>
    </div>

    <!-- NOTES SECTION -->
    <div id="notesSection" style="display:none">

      <div class="topbar">
        <h1>My Notes</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('notes', event)">📝 Notes</button>
        <button class="tab" onclick="switchTab('bin', event)">🗑️ Recycle Bin</button>
      </div>

      <div id="activeSection">
        <div class="input-box">
          <input id="noteInput" type="text" placeholder="Write a note..." />
          <button class="save-btn" onclick="saveNote()">Save</button>
        </div>
        <div id="notesList"></div>
      </div>

      <div id="binSection" style="display:none">
        <div id="binList"></div>
      </div>

    </div>

  </div>

  <script>
    let token = localStorage.getItem("token")

    if (token) {
      showApp()
    }

    function showSignup() {
      document.querySelector("#loginForm").style.display = "none"
      document.querySelector("#signupForm").style.display = "block"
    }

    function showLogin() {
      document.querySelector("#signupForm").style.display = "none"
      document.querySelector("#loginForm").style.display = "block"
    }

    function showApp() {
      document.querySelector("#authSection").style.display = "none"
      document.querySelector("#notesSection").style.display = "block"
      loadNotes()
    }

    async function signup() {
      const email = document.querySelector("#signupEmail").value
      const password = document.querySelector("#signupPassword").value

      const response = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })

      const data = await response.json()

      if (!response.ok) {
        document.querySelector("#signupError").textContent = data.message
        return
      }

      alert("Account created! Please login.")
      showLogin()
    }

    async function login() {
      const email = document.querySelector("#loginEmail").value
      const password = document.querySelector("#loginPassword").value

      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })

      const data = await response.json()

      if (!response.ok) {
        document.querySelector("#loginError").textContent = data.message
        return
      }

      token = data.token
      localStorage.setItem("token", token)
      showApp()
    }

    function logout() {
      localStorage.removeItem("token")
      token = null
      document.querySelector("#authSection").style.display = "block"
      document.querySelector("#notesSection").style.display = "none"
    }

    function switchTab(tab, event) {
      const tabs = document.querySelectorAll(".tab")
      tabs.forEach(function(t) { t.classList.remove("active") })
      event.target.classList.add("active")

      if (tab === "notes") {
        document.querySelector("#activeSection").style.display = "block"
        document.querySelector("#binSection").style.display = "none"
        loadNotes()
      } else {
        document.querySelector("#activeSection").style.display = "none"
        document.querySelector("#binSection").style.display = "block"
        loadBin()
      }
    }

    async function loadNotes() {
      const response = await fetch("/notes", {
        headers: { "Authorization": token }
      })
      const notes = await response.json()
      const notesList = document.querySelector("#notesList")
      notesList.innerHTML = ""

      if (notes.length === 0) {
        notesList.innerHTML = "<p class='empty'>No notes yet. Write one above!</p>"
        return
      }

      notes.forEach(function(note) {
        notesList.innerHTML += `
          <div class="note">
            <div class="note-content">
              <p>${note.text}</p>
              <span>${note.created_at}</span>
            </div>
            <div class="actions">
              <button class="delete-btn" onclick="deleteNote(${note.id})">🗑️ Delete</button>
            </div>
          </div>
        `
      })
    }

    async function loadBin() {
      const response = await fetch("/notes/deleted", {
        headers: { "Authorization": token }
      })
      const notes = await response.json()
      const binList = document.querySelector("#binList")
      binList.innerHTML = ""

      if (notes.length === 0) {
        binList.innerHTML = "<p class='empty'>Recycle bin is empty!</p>"
        return
      }

      notes.forEach(function(note) {
        binList.innerHTML += `
          <div class="note">
            <div class="note-content">
              <p>${note.text}</p>
              <span>${note.created_at}</span>
            </div>
            <div class="actions">
              <button class="restore-btn" onclick="restoreNote(${note.id})">♻️ Restore</button>
              <button class="permanent-btn" onclick="permanentDelete(${note.id})">❌ Delete Forever</button>
            </div>
          </div>
        `
      })
    }

    async function saveNote() {
      const input = document.querySelector("#noteInput")
      const text = input.value
      if (text === "") return

      await fetch("/notes", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": token
        },
        body: JSON.stringify({ text })
      })

      input.value = ""
      loadNotes()
    }

    async function deleteNote(id) {
      await fetch("/notes/" + id, {
        method: "DELETE",
        headers: { "Authorization": token }
      })
      loadNotes()
    }

    async function restoreNote(id) {
      await fetch("/notes/" + id + "/restore", {
        method: "PUT",
        headers: { "Authorization": token }
      })
      loadBin()
    }

    async function permanentDelete(id) {
      await fetch("/notes/" + id + "/permanent", {
        method: "DELETE",
        headers: { "Authorization": token }
      })
      loadBin()
    }
  </script>

</body>
</html>
